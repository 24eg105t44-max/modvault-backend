server.port=8080

spring.application.name=modvault-backend

# Datasource configuration (Default with smart fallback, easily overridden by env vars for production MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:modvaultdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Do not auto-run schema.sql on embedded H2 startup
spring.sql.init.mode=never

# Security & JWT
jwt.secret=modvault_secret_super_secure_key_12345678901234567890_antigravity
jwt.expiration=86400000

# Jackson Serialization
spring.jackson.serialization.fail-on-empty-beans=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.modvault=INFO
